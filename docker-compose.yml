# docker-compose.yml — SGLang MONITORING stack (isolated from the vLLM stack).
#
# This compose file only runs the *monitoring* services. The SGLang inference
# server itself is started separately by the run scripts (default:
# run-sglang-dflash.sh / run-sglang-dflash-vision.sh, alternative:
# run-sglang-godspeed.sh / run-sglang-vision.sh; standalone `podman run`,
# GPU via nvidia CDI).
#
# For Prometheus to scrape the live server, the SGLang container joins the
# `sglang_monitor` network (the run scripts add `--network sglang_monitor`),
# so Prometheus targets `sglang-qwen38:30000`.
#
# Port scheme (all host ports are overridable in .env; the defaults below are
# chosen to be low-conflict on a single-GPU box):
#   SGLang API (run script)  -> 8040  (HOST_PORT)
#   caddy gateway (SGLang)   -> 8041  (GATEWAY_HOST_PORT)
#   grafana (SGLang)         -> 8042  (GRAFANA_HOST_PORT)
#   prometheus (SGLang)      -> 9091 (PROMETHEUS_HOST_PORT, LAN-reachable)
#
# Bring up:  podman-compose -f docker-compose.yml up -d
# Stop:       podman-compose -f docker-compose.yml down

services:
  # Basic-auth gateway in front of the SGLang server (mirrors the vLLM caddy):
  #   /v1, /v1/*   -> SGLang API (bearer token = API_KEY from .env)
  #   /metrics     -> SGLang Prometheus telemetry
  #   /dcgm/metrics-> dcgm-sglang /metrics (per-GPU telemetry)
  # Fail-closed: caddy refuses to start if METRICS_HASH is unset.
  caddy:
    image: caddy:2.11.4-alpine
    container_name: caddy-sglang
    restart: "always"
    ports:
      - "${GATEWAY_HOST_PORT:-8041}:8030"
    environment:
      - METRICS_USER=${METRICS_USER:-metrics}
      - METRICS_HASH=${METRICS_HASH:-}
      - VLLM_API_KEY=${API_KEY:-}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data_sglang:/data
      - caddy_config_sglang:/config
    networks: [sglang_monitor]
    depends_on:
      - dcgm-exporter

  # Scrapes sglang-qwen38:30000/metrics and dcgm-sglang:9400 (see
  # prometheus/prometheus.yml). UI bound to 127.0.0.1:9091 only. 30-day retention.
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: prometheus-sglang
    restart: "always"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    # Exposed on the LAN (0.0.0.0) so the UI is reachable from other machines
    # on the network; it still scrapes only targets inside the sglang_monitor
    # network. 30-day retention.
    ports:
      - "0.0.0.0:${PROMETHEUS_HOST_PORT:-9091}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data_sglang:/prometheus
    networks: [sglang_monitor]
    depends_on:
      - dcgm-exporter

  # SGLang dashboard auto-provisioned from ./grafana/dashboards/ (folder "sglang").
  # Login: admin / GRAFANA_ADMIN_PASSWORD from .env (applied on first DB init).
  grafana:
    image: grafana/grafana:13.2.0
    container_name: grafana-sglang
    restart: "always"
    ports:
      - "0.0.0.0:${GRAFANA_HOST_PORT:-8042}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data_sglang:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [sglang_monitor]
    depends_on:
      - prometheus

  # Per-GPU metrics (utilization, memory, power, temps). Same NVML exporter the
  # vLLM stack uses — engine-agnostic. Exposes DCGM_FI_DEV_* on :9400 inside the
  # sglang_monitor network; Prometheus scrapes dcgm-exporter:9400 (job "dcgm").
  #
  # Built from a public base image + pypi (dcgm-exporter/), so no nvcr.io (NGC)
  # login is needed. The exporter only needs the NVML driver library, which the
  # NVIDIA container toolkit injects into any container that reserves the GPU.
  # NOTE: GPU attach under podman-compose can be flaky; if this service comes
  # up without GPU, see run-monitor.sh which can start dcgm standalone.
  dcgm-exporter:
    build:
      context: dcgm-exporter
    container_name: dcgm-sglang
    restart: "always"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    networks: [sglang_monitor]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  sglang_monitor:
    name: sglang_monitor

volumes:
  caddy_data_sglang:
  caddy_config_sglang:
  prometheus_data_sglang:
  grafana_data_sglang:
